plugins {
    id 'com.android.application'
}

android {
    namespace 'com.recibosvina.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.recibosvina.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // WebView para mostrar el recibo PDF
    // (sin AdMob por ahora — se agrega cuando el usuario cree la cuenta)
}
