<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>ViñaRecibos · Panel patrón</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="topbar">
        <div class="eyebrow"><span>VR</span> <span id="nombreLabel">Patrón</span></div>
        <button class="back-btn" onclick="AndroidBridge.goHome()">← Inicio</button>
      </div>

      <header class="brand">
        <h1>Panel del <span>Patrón</span></h1>
        <p class="subtitle">Registrá contratistas y generá sus recibos</p>
      </header>

      <div class="divider">Registrar contratista</div>
      <div class="actions">
        <div class="field">
          <label for="cuil">CUIL del contratista</label>
          <input id="cuil" type="text" placeholder="20-XXXXXXXX-X">
        </div>
        <div class="field">
          <label for="nombre">Nombre y apellido</label>
          <input id="nombre" type="text" placeholder="García, Carlos Fernando">
        </div>
        <button class="btn btn-primary" onclick="registrarContratista()">REGISTRAR CONTRATISTA</button>
      </div>

      <div class="divider">Generar recibo</div>
      <div class="actions">
        <div class="field">
          <label for="periodo">Período</label>
          <input id="periodo" type="text" placeholder="ENERO 2026">
        </div>
        <div class="field">
          <label for="concepto">Concepto</label>
          <input id="concepto" type="text" placeholder="100 HAS EN PRODUCCIÓN">
        </div>
        <div class="field">
          <label for="remunerativo">Remunerativo</label>
          <input id="remunerativo" type="number" placeholder="68280.95">
        </div>
        <button class="btn btn-secondary" onclick="generarRecibo()">GENERAR RECIBO</button>
      </div>

      <p class="hint">💡 El recibo se genera en formato nuevo (Decreto 407/2026) y el contratista lo firma desde su teléfono.</p>

      <footer class="footer"><span>ViñaRecibos</span><span class="dot">•</span><span>Mendoza, Argentina</span></footer>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.querySelector('.toast');
    let timer;
    function notify(m) { toast.textContent = m; toast.classList.add('show'); clearTimeout(timer); timer = setTimeout(() => toast.classList.remove('show'), 3000); }

    function registrarContratista() {
      const cuil = document.getElementById('cuil').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      if (!cuil || !nombre) { notify('Completá CUIL y nombre'); return; }
      const ok = AndroidBridge.registrarContratista(cuil, nombre);
      notify(ok ? '✅ Contratista registrado!' : '❌ Error al registrar');
      if (ok) { document.getElementById('cuil').value = ''; document.getElementById('nombre').value = ''; }
    }

    function generarRecibo() {
      const cuil = document.getElementById('cuil').value.trim();
      const periodo = document.getElementById('periodo').value.trim();
      const concepto = document.getElementById('concepto').value.trim();
      const rem = document.getElementById('remunerativo').value.trim();
      if (!cuil || !periodo || !rem) { notify('Completá CUIL, período y remunerativo'); return; }
      const ok = AndroidBridge.generarRecibo(cuil, periodo, concepto, rem);
      notify(ok ? '✅ Recibo generado!' : '❌ Error generando recibo');
      if (ok) { document.getElementById('periodo').value = ''; document.getElementById('remunerativo').value = ''; }
    }
  </script>
</body>
</html>
