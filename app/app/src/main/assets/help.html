<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06101d">
  <title>ViñaRecibos · Centro de ayuda</title>
  <style>
    :root { --bg:#06101d; --line:rgba(170,209,255,.15); --text:#f4f8ff; --muted:#91a6bf; --blue:#5ba9ff; --mint:#5de1b2; }
    * { box-sizing:border-box; }
    html,body { height:100%; }
    body { margin:0; padding:14px; color:var(--text); font-family:'DM Sans',Arial,sans-serif; background:transparent; display:flex; flex-direction:column; height:100vh; }
    .chat-header { display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    .chat-header .dot-online { width:8px; height:8px; border-radius:50%; background:var(--mint); box-shadow:0 0 10px var(--mint); animation:glow 2s ease-in-out infinite; }
    @keyframes glow { 50% { box-shadow:0 0 16px var(--mint); } }
    .chat-header .titulo { font-size:14px; font-weight:700; }
    .chat-header .sub { color:var(--muted); font-size:11px; }
    .chat-msgs { flex:1; overflow-y:auto; padding:14px 4px; display:flex; flex-direction:column; gap:10px; scrollbar-width:thin; }
    .msg { max-width:82%; padding:11px 14px; border-radius:16px; font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
    .msg-user { align-self:flex-end; background:linear-gradient(105deg,#347cff,#2756d7); border-bottom-right-radius:5px; color:#fff; }
    .msg-bot { align-self:flex-start; background:rgba(255,255,255,.07); border:1px solid var(--line); border-bottom-left-radius:5px; color:#dcecff; }
    .msg-bot.typing { color:var(--muted); font-style:italic; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; padding:10px 2px 4px; }
    .chip { padding:8px 13px; border:1px solid rgba(91,169,255,.35); border-radius:999px; color:#9bc8ff; background:rgba(91,169,255,.08); font-size:11.5px; font-weight:600; cursor:pointer; transition:background .2s,border-color .2s; }
    .chip:hover { background:rgba(91,169,255,.18); border-color:var(--blue); }
    .chat-input { display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--line); }
    .chat-input input { flex:1; height:48px; padding:0 15px; border:1px solid rgba(170,209,255,.17); border-radius:14px; outline:none; color:var(--text); background:rgba(255,255,255,.055); font:inherit; font-size:13.5px; }
    .chat-input input::placeholder { color:#6f849d; } .chat-input input:focus { border-color:var(--blue); }
    .chat-input button { width:52px; height:48px; border:0; border-radius:14px; background:linear-gradient(105deg,#347cff,#2756d7); color:#fff; font-size:18px; cursor:pointer; transition:filter .2s; }
    .chat-input button:hover { filter:brightness(1.12); }
    .chat-input button:disabled { opacity:.5; }
  </style>
</head>
<body>
  <div class="chat-header">
    <div class="dot-online"></div>
    <div><div class="titulo">Asistente ViñaRecibos</div><div class="sub">Respondo al instante · info@charly-tricks.dev</div></div>
  </div>

  <div class="chat-msgs" id="msgs">
    <div class="msg msg-bot">¡Hola! 👋 Soy el asistente de ViñaRecibos. Preguntame lo que necesites: cómo subir tu firma, firmar un recibo, entrar a la app y más.</div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" data-q="¿Cómo subo mi firma?">🖋️ Subir firma</button>
    <button class="chip" data-q="¿Cómo firmo un recibo?">✍️ Firmar recibo</button>
    <button class="chip" data-q="¿Cómo entro como contratista?">📲 Entrar</button>
    <button class="chip" data-q="Me dice que el nombre no coincide">🔑 Nombre no coincide</button>
    <button class="chip" data-q="¿Por qué veo anuncios?">📢 Anuncios</button>
    <button class="chip" id="ads-chip">ⓘ Gestionar anuncios</button>
  </div>

  <div class="chat-input">
    <input id="input" type="text" placeholder="Escribí tu pregunta…">
    <button id="send" onclick="enviar()">➤</button>
  </div>

  <script>
    const msgs=document.getElementById('msgs');
    const input=document.getElementById('input');
    const sendBtn=document.getElementById('send');
    let escribiendo=false;

    function addMsg(texto,tipo){
      const div=document.createElement('div');
      div.className='msg '+tipo;
      div.textContent=texto;
      msgs.appendChild(div);
      msgs.scrollTop=msgs.scrollHeight;
      return div;
    }

    function enviar(){
      const pregunta=input.value.trim();
      if(!pregunta||escribiendo)return;
      input.value='';
      addMsg(pregunta,'msg-user');
      const typing=addMsg('Escribiendo…','msg-bot typing');
      escribiendo=true; sendBtn.disabled=true;
      fetch('http://157.250.202.243:8400/api/ayuda',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pregunta:pregunta})
      })
      .then(r=>r.json())
      .then(d=>{
        typing.remove();
        addMsg(d.ok?d.respuesta:('😕 '+d.error),'msg-bot');
      })
      .catch(()=>{
        typing.remove();
        addMsg('😕 No pude conectar con el asistente. Revisá tu conexión e intentá de nuevo.','msg-bot');
      })
      .finally(()=>{escribiendo=false;sendBtn.disabled=false;});
    }

    document.querySelectorAll('.chip:not(#ads-chip)').forEach(c=>c.addEventListener('click',()=>{
      input.value=c.dataset.q; enviar();
    }));
    // ⓘ Gestión de anuncios — abre la config de anuncios de Google
    document.getElementById('ads-chip').addEventListener('click',()=>{
      if(window.AndroidBridge&&AndroidBridge.openAdSettings)AndroidBridge.openAdSettings();
    });
    input.addEventListener('keydown',e=>{if(e.key==='Enter')enviar();});
  </script>
</body>
</html>
