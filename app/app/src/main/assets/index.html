<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="ViñaRecibos: firma digital de recibos de sueldo para contratistas de viñas y frutales.">
  <title>ViñaRecibos · Acceso seguro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06101d;
      --surface: rgba(13, 27, 47, .72);
      --surface-soft: rgba(255, 255, 255, .045);
      --line: rgba(170, 209, 255, .15);
      --text: #f4f8ff;
      --muted: #91a6bf;
      --blue: #5ba9ff;
      --blue-deep: #286dff;
      --mint: #5de1b2;
      --violet: #9c7bff;
      --shadow: 0 28px 80px rgba(0, 0, 0, .44);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      overflow-x: hidden;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      background:
        radial-gradient(circle at 16% 12%, rgba(40, 109, 255, .25), transparent 28rem),
        radial-gradient(circle at 88% 82%, rgba(93, 225, 178, .12), transparent 25rem),
        linear-gradient(145deg, #08182b 0%, var(--bg) 52%, #081321 100%);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image: linear-gradient(rgba(133, 175, 221, .055) 1px, transparent 1px), linear-gradient(90deg, rgba(133, 175, 221, .055) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, #000, transparent 78%);
      animation: gridDrift 18s linear infinite;
    }

    body::after {
      content: '';
      position: fixed;
      inset: -100% 0;
      pointer-events: none;
      z-index: 5;
      opacity: .08;
      background: repeating-linear-gradient(0deg, transparent 0 4px, rgba(143, 203, 255, .22) 5px, transparent 6px);
      animation: scanline 12s linear infinite;
    }

    @keyframes gridDrift { to { background-position: 42px 42px; } }
    @keyframes scanline { to { transform: translateY(100%); } }
    @keyframes float { 0%, 100% { transform: translateY(0) rotateX(0); } 50% { transform: translateY(-7px) rotateX(2deg); } }
    @keyframes glowPulse { 0%, 100% { box-shadow: 0 0 0 rgba(93, 225, 178, 0); } 50% { box-shadow: 0 0 18px rgba(93, 225, 178, .28); } }
    @keyframes borderFlow { to { background-position: 200% center; } }
    @keyframes shimmer { to { transform: translateX(160%); } }

    .shell {
      width: min(100%, 470px);
      position: relative;
      isolation: isolate;
      perspective: 1200px;
    }

    .shell::before {
      content: '';
      position: absolute;
      z-index: -1;
      inset: 12% -12% -12%;
      border-radius: 50%;
      background: rgba(40, 109, 255, .13);
      filter: blur(60px);
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px;
      transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
      transition: transform .18s ease-out, box-shadow .3s ease;
      will-change: transform;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(19, 39, 66, .82), rgba(7, 19, 34, .88));
      box-shadow: var(--shadow), inset 0 1px rgba(255, 255, 255, .08);
      backdrop-filter: blur(24px);
    }

    .card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--blue), var(--mint), var(--violet), transparent);
      background-size: 200% auto;
      opacity: .9;
      animation: borderFlow 5s linear infinite;
    }

    .card::before {
      content: '';
      position: absolute;
      width: 180px;
      height: 180px;
      top: -110px;
      right: -80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(91, 169, 255, .25), transparent 68%);
      filter: blur(8px);
      pointer-events: none;
      animation: float 7s ease-in-out infinite;
    }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px; border: 1px solid rgba(93, 225, 178, .19); border-radius: 999px; color: #a7f5d5; background: rgba(93, 225, 178, .08); font-size: 11px; font-weight: 600; }
    .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 12px var(--mint); animation: glowPulse 2s ease-in-out infinite; }

    .brand { text-align: center; }
    .logo {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border: 1px solid rgba(152, 203, 255, .35);
      border-radius: 25px;
      background: linear-gradient(145deg, rgba(72, 145, 255, .32), rgba(112, 65, 219, .28));
      box-shadow: 0 18px 40px rgba(40, 109, 255, .24), inset 0 1px rgba(255, 255, 255, .22);
      animation: float 5s ease-in-out infinite;
    }
    .logo svg { width: 49px; height: 49px; filter: drop-shadow(0 4px 10px rgba(91, 169, 255, .35)); animation: logoSpin 12s linear infinite; }
    @keyframes logoSpin { 0%, 70% { transform: rotate(0deg) scale(1); } 78% { transform: rotate(5deg) scale(1.06); } 86% { transform: rotate(-5deg) scale(1.06); } 94%, 100% { transform: rotate(0deg) scale(1); } }
    h1 { margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(30px, 8vw, 40px); letter-spacing: -.045em; line-height: 1; }
    h1 span { color: var(--blue); }
    .subtitle { max-width: 340px; margin: 13px auto 30px; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .actions { display: grid; gap: 12px; }
    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 17px;
      border: 1px solid transparent;
      border-radius: 17px;
      color: #fff;
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, filter .22s ease;
    }
    .btn::after { content: ''; position: absolute; inset: 0 auto 0 -80%; width: 45%; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.22), transparent); pointer-events: none; }
    .btn:hover { transform: translateY(-3px) scale(1.012); filter: brightness(1.08); }
    .btn:hover::after { animation: shimmer .8s ease forwards; }
    .btn:focus-visible, .bio:focus-visible { outline: 3px solid rgba(91, 169, 255, .7); outline-offset: 3px; }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: linear-gradient(105deg, #347cff, #2756d7); box-shadow: 0 12px 28px rgba(40, 109, 255, .24); }
    .btn-secondary { background: linear-gradient(105deg, #168d77, #126553); box-shadow: 0 12px 28px rgba(22, 141, 119, .2); }
    .btn-icon { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.14); }
    .btn-icon svg { width: 20px; height: 20px; }
    .btn-copy { flex: 1; }
    .btn-label { display: block; font-size: 15px; font-weight: 700; }
    .btn-hint { display: block; margin-top: 2px; color: rgba(255,255,255,.7); font-size: 11px; font-weight: 500; }
    .arrow { width: 18px; opacity: .75; }

    .divider { display: flex; align-items: center; gap: 12px; margin: 23px 0 14px; color: #71869f; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: var(--line); }

    .bio { display: flex; align-items: center; gap: 15px; padding: 16px; border: 1px solid var(--line); border-radius: 19px; background: var(--surface-soft); cursor: pointer; transition: background .2s ease, border-color .2s ease; }
    .bio:hover { border-color: rgba(91, 169, 255, .4); background: rgba(91, 169, 255, .08); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(40, 109, 255, .12); }
    .fingerprint { width: 50px; height: 50px; flex: 0 0 50px; display: grid; place-items: center; border: 1px solid rgba(91, 169, 255, .4); border-radius: 15px; background: rgba(91, 169, 255, .1); box-shadow: 0 0 24px rgba(91, 169, 255, .13); }
    .fingerprint svg { width: 27px; height: 27px; }
    .bio-title { margin-bottom: 3px; font-size: 14px; font-weight: 700; }
    .bio-sub { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .bio-arrow { width: 18px; margin-left: auto; color: var(--muted); }

    .footer { display: flex; justify-content: center; gap: 9px; margin-top: 22px; color: #71869f; font-size: 11px; }
    .footer .dot { color: var(--blue); }
    .toast { position: fixed; left: 50%; bottom: 22px; z-index: 2; padding: 12px 17px; border: 1px solid rgba(91, 169, 255, .3); border-radius: 12px; color: var(--text); background: #10243b; box-shadow: var(--shadow); font-size: 13px; transform: translate(-50%, 140%); transition: transform .3s ease; }
    .toast.show { transform: translate(-50%, 0); }

    @media (max-width: 420px) { .card { padding: 24px 19px; border-radius: 25px; } .topbar { margin-bottom: 24px; } .status { padding: 6px 8px; font-size: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; transform: none !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card" aria-labelledby="page-title">
      <div class="topbar">
        <div class="eyebrow"><span>VR</span> Plataforma digital</div>
        <div class="status" id="deviceStatus">Dispositivo</div>
      </div>

      <header class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M34 20C38 11 47 8 54 10C53 19 47 26 37 27" fill="#5DE1B2" fill-opacity=".9"/>
            <path d="M33 25C27 16 19 14 11 17C13 27 21 32 31 31" fill="#9C7BFF" fill-opacity=".9"/>
            <circle cx="22" cy="40" r="8" fill="#8CC7FF"/><circle cx="33" cy="40" r="8" fill="#6BABFF"/><circle cx="28" cy="49" r="8" fill="#5B91FF"/><circle cx="40" cy="49" r="8" fill="#4779E8"/>
            <path d="M29 29C30 24 33 20 38 16" stroke="#F4F8FF" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 id="page-title">Viña<span>Recibos</span></h1>
        <p class="subtitle">Firma digital de recibos de sueldo para contratistas de viñas y frutales en Mendoza.</p>
      </header>

      <div class="actions" aria-label="Seleccionar tipo de acceso">
        <button class="btn btn-primary" type="button" data-role="patron">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11"/><path d="M8 20v-6h8v6M3 20h18"/></svg></span>
          <span class="btn-copy"><span class="btn-label">Soy patrón</span><span class="btn-hint">Gestionar y emitir recibos</span></span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="btn btn-secondary" type="button" data-role="contratista">
          <span class="btn-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h4"/><path d="M8 12h8M8 16h5M9 8h6"/></svg></span>
          <span class="btn-copy"><span class="btn-label">Soy contratista</span><span class="btn-hint">Consultar y firmar recibos</span></span>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>

      <div class="divider">Acceso biométrico</div>
      <div class="bio" role="button" tabindex="0" aria-label="Ingresar con huella dactilar" data-role="biometrico">
        <div class="fingerprint" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#8CC7FF" stroke-width="1.5" stroke-linecap="round"><path d="M8 13a4 4 0 0 1 8 0v1M10 17v-1a2 2 0 0 1 4 0v1M6 13a6 6 0 0 1 12 0c0 3-1 5-2 7M12 3a8 8 0 0 1 8 8c0 4-1 7-3 10M12 3a8 8 0 0 0-8 8c0 4 1 7 3 10"/></svg></div>
        <div><div class="bio-title">Ingresar con huella</div><div class="bio-sub">Rápido, seguro y sin contraseña</div></div>
        <svg class="bio-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>

      <footer class="footer"><span>Versión 1.0</span><span class="dot">•</span><span>Mendoza, Argentina</span></footer>
    </section>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    const toast = document.querySelector('.toast');
    let timer;
    function notify(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Mostrar el modelo del dispositivo (inyectado desde Android)
    if (window.AndroidBridge && window.AndroidBridge.getDeviceModel) {
      document.getElementById('deviceStatus').textContent = window.AndroidBridge.getDeviceModel();
    }

    const shell = document.querySelector('.shell');
    const card = document.querySelector('.card');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      shell.addEventListener('pointermove', (event) => {
        const rect = card.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width - 0.5;
        const y = (event.clientY - rect.top) / rect.height - 0.5;
        card.style.setProperty('--ry', (x * 5) + 'deg');
        card.style.setProperty('--rx', (y * -5) + 'deg');
      });
      shell.addEventListener('pointerleave', () => {
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--rx', '0deg');
      });
    }

    document.querySelectorAll('[data-role]').forEach((control) => {
      const activate = () => {
        if (window.AndroidBridge) {
          if (control.dataset.role === 'patron') window.AndroidBridge.openPatron();
          else if (control.dataset.role === 'contratista') window.AndroidBridge.openContratista();
          else window.AndroidBridge.biometricAuth();
        } else {
          const messages = { patron: 'Acceso para patrones seleccionado', contratista: 'Acceso para contratistas seleccionado', biometrico: 'Preparando acceso biométrico' };
          notify(messages[control.dataset.role]);
        }
      };
      control.addEventListener('click', activate);
      control.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); activate(); } });
    });
  </script>
</body>
</html>
